<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">STRESS cover art</title>
  <desc id="desc">A distressed grey surface scattered with dark red droplets, a blurred pink shape, and red STRESS lettering.</desc>
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="18"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .34"/></feComponentTransfer></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="3" seed="9" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/></filter>
    <linearGradient id="concrete" x2="1" y2="1"><stop stop-color="#b4b0a9"/><stop offset=".44" stop-color="#77766f"/><stop offset="1" stop-color="#aaa29e"/></linearGradient>
  </defs>
  <rect width="1600" height="1600" fill="url(#concrete)"/>
  <rect width="1600" height="1600" filter="url(#grain)" opacity=".8"/>
  <g fill="#4b0711" filter="url(#rough)" opacity=".92">
    <circle cx="570" cy="85" r="48"/><circle cx="454" cy="179" r="46"/><circle cx="625" cy="189" r="46"/><circle cx="752" cy="177" r="48"/><circle cx="1035" cy="194" r="42"/>
    <circle cx="450" cy="258" r="55"/><circle cx="720" cy="266" r="50"/><ellipse cx="989" cy="329" rx="68" ry="78"/><circle cx="191" cy="490" r="45"/>
    <circle cx="657" cy="500" r="56"/><circle cx="760" cy="431" r="50"/><circle cx="814" cy="497" r="55"/><circle cx="1150" cy="463" r="40"/>
    <circle cx="101" cy="672" r="53"/><circle cx="724" cy="645" r="54"/><circle cx="972" cy="758" r="47"/><circle cx="566" cy="826" r="51"/><circle cx="660" cy="811" r="47"/>
  </g>
  <g fill="#edc5c8" opacity=".78" filter="url(#blur)"><ellipse cx="1490" cy="848" rx="350" ry="277"/><ellipse cx="1400" cy="1365" rx="402" ry="408"/></g>
  <text x="100" y="1240" fill="#b41112" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="210" letter-spacing="-12" filter="url(#rough)">STRESS</text>
  <text x="884" y="1498" fill="#dcec7a" font-family="monospace" font-size="51" font-weight="700" letter-spacing="3">2026/09/18 18:26:39</text>
</svg>
